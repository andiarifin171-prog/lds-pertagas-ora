name: Build Aplikasi PC (Windows)

on:
  push:
    branches: [main, aplikasi-pc]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pasang dependensi
        run: npm install --no-audit --no-fund

      - name: Uji aturan link
        run: npm test

      - name: Buat installer Windows
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Ambil versi aplikasi
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Simpan installer (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: LDS-Quick-Response-Setup-${{ steps.ver.outputs.version }}
          path: desktop/dist/*.exe

      - name: Terbitkan ke GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Aplikasi PC v${{ steps.ver.outputs.version }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          files: desktop/dist/*.exe
          body: |
            Installer aplikasi PC **LDS Quick-Response & Security Dispatch** untuk Windows 10/11 (64-bit).

            **Cara pasang**
            1. Unduh file `LDS-Quick-Response-Setup-${{ steps.ver.outputs.version }}.exe` di bawah.
            2. Jalankan file tersebut. Bila muncul "Windows protected your PC", klik **More info** lalu **Run anyway**.
            3. Aplikasi terpasang untuk pengguna ini (tanpa hak admin) dan muncul di Start Menu serta Desktop.

            Isi aplikasi dimuat dari https://andiarifin171-prog.github.io/lds-pertagas-ora/ sehingga selalu mengikuti versi terbaru.
            Tombol WA membuka WhatsApp Desktop; bila belum terpasang, otomatis memakai WhatsApp Web.
