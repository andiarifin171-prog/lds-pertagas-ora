<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LDS Quick-Response &amp; Security Dispatch</title>
  <style>
    :root { --navy: #0B2545; --blue: #0D6EBD; --muted: #64748B; --bg: #F1F5F9; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); font-family: "Segoe UI", system-ui, sans-serif; color: var(--navy); padding: 16px; }
    .card { background: #fff; border: 1px solid #E2E8F0; border-radius: 16px; padding: 32px 28px; max-width: 440px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(11, 37, 69, .08); }
    .icon { font-size: 44px; margin-bottom: 8px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 14px; color: var(--muted); line-height: 1.55; margin: 0 0 20px; }
    button { background: var(--blue); color: #fff; border: 0; border-radius: 10px; padding: 11px 22px; font-size: 14px; font-weight: 700; cursor: pointer; }
    button:hover { background: var(--navy); }
    .small { font-size: 12px; margin-top: 16px; margin-bottom: 0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Tidak ada koneksi internet</h1>
    <p>Aplikasi LDS Quick-Response &amp; Security Dispatch belum bisa dimuat. Periksa koneksi internet PC, lalu coba lagi.</p>
    <button onclick="location.href='https://andiarifin171-prog.github.io/lds-pertagas-ora/'">🔄 Coba Lagi</button>
    <p class="small">Setelah berhasil dibuka sekali, aplikasi menyimpan versi terakhir sehingga tetap bisa dibuka saat internet terputus.</p>
  </div>
</body>
</html>
